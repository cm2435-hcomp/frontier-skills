name: release

on:
  push:
    tags: ["20*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify release tag
        run: test "$(uv run python -c 'import yaml; print(yaml.safe_load(open("registry.yaml"))["revision"])')" = "$GITHUB_REF_NAME"
      - run: uv run pytest -q
      - run: uv run python scripts/build_release.py --output dist/release
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/release.json dist/release/release.tar.gz --verify-tag --generate-notes
